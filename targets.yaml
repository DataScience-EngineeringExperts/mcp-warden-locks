# Attestation targets for the dse-nightly attester. Every coordinate is an exact
# published version; `spawn` is the argv run INSIDE the sandbox after stage-1 pre-fetch
# (packages live under /cache/<ecosystem>/<segment>). `env` holds obviously fake
# credentials for servers that refuse to start without one. `skip: true` + `note`
# records a target that cannot list its surface without a live backend.
targets:
- coordinate: npm:@modelcontextprotocol/server-filesystem@2026.8.31
  spawn:
  - node
  - /cache/npm/@modelcontextprotocol__server-filesystem/node_modules/.bin/mcp-server-filesystem
  - /tmp
- coordinate: npm:@modelcontextprotocol/server-memory@2026.8.31
  spawn:
  - node
  - /cache/npm/@modelcontextprotocol__server-memory/node_modules/.bin/mcp-server-memory
  env:
    MEMORY_FILE_PATH: /tmp/memory.json
- coordinate: npm:@modelcontextprotocol/server-everything@2026.8.31
  spawn:
  - node
  - /cache/npm/@modelcontextprotocol__server-everything/node_modules/.bin/mcp-server-everything
- coordinate: npm:@modelcontextprotocol/server-sequential-thinking@2026.8.31
  spawn:
  - node
  - /cache/npm/@modelcontextprotocol__server-sequential-thinking/node_modules/.bin/mcp-server-sequential-thinking
- coordinate: npm:@modelcontextprotocol/server-github@2025.4.8
  spawn:
  - node
  - /cache/npm/@modelcontextprotocol__server-github/node_modules/.bin/mcp-server-github
  env:
    GITHUB_PERSONAL_ACCESS_TOKEN: ghp_DUMMY_NOT_A_TOKEN
  note: archived upstream; still widely pinned
- coordinate: npm:@modelcontextprotocol/server-puppeteer@2025.5.12
  spawn:
  - node
  - /cache/npm/@modelcontextprotocol__server-puppeteer/node_modules/.bin/mcp-server-puppeteer
  env:
    PUPPETEER_SKIP_DOWNLOAD: '1'
- coordinate: npm:@modelcontextprotocol/server-brave-search@0.6.2
  spawn:
