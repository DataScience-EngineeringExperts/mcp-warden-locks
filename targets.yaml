- coordinate: npm:@modelcontextprotocol/server-slack@2025.4.25
  spawn:
  - node
  - /cache/npm/@modelcontextprotocol__server-slack/node_modules/.bin/mcp-server-slack
  env:
    SLACK_BOT_TOKEN: xoxb-DUMMY
    SLACK_TEAM_ID: T00000000
- coordinate: npm:@modelcontextprotocol/server-gitlab@2025.4.25
  spawn:
  - node
  - /cache/npm/@modelcontextprotocol__server-gitlab/node_modules/.bin/mcp-server-gitlab
  env:
    GITLAB_PERSONAL_ACCESS_TOKEN: DUMMY
- coordinate: npm:@modelcontextprotocol/server-redis@2025.4.25
  spawn:
  - node
  - /cache/npm/@modelcontextprotocol__server-redis/node_modules/.bin/mcp-server-redis
  - redis://127.0.0.1:6379
  note: connects to Redis at startup (ECONNREFUSED under --network none); cannot list a surface without a live backend
  skip: true
- coordinate: npm:@modelcontextprotocol/server-everart@0.6.2
  spawn:
